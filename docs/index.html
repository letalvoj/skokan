<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,viewport-fit=cover"name=viewport><title>SKOKAN</title><meta content="A one-button neon platform runner, built for a homemade ESP32 arcade box."name=description><meta content=SKOKAN property=og:title><meta content="A one-button neon platform runner, built for a homemade ESP32 arcade box."property=og:description><meta content=website property=og:type><style>:root{--ink:#f4e9ff;--dim:#9d86c9;--mag:#f81ff0;--cyan:#3ef0ff;--bg0:#120024;--bg1:#25073f;--edge:#48157a}*{box-sizing:border-box}body,html{height:100%}body{margin:0;background:var(--bg0);color:var(--ink);font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;background-image:radial-gradient(120% 80% at 50% 0,#3a0a5e 0,transparent 60%),linear-gradient(180deg,var(--bg0),#08000f);-webkit-text-size-adjust:100%}h1{margin:0;font-size:clamp(28px,7vw,46px);letter-spacing:.14em;font-weight:800;color:var(--cyan);text-shadow:3px 3px 0 var(--mag)}.sub{margin:-8px 0 0;color:var(--dim);font-size:12px;letter-spacing:.08em}#wrap{border:2px solid var(--edge);border-radius:10px;padding:10px;background:#0b0016;box-shadow:0 0 0 1px #000 inset,0 18px 60px -20px var(--mag);max-width:100%}canvas{display:block;width:min(92vw,960px);height:auto;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:4px;outline:0;touch-action:none}.keys{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:12px}kbd{background:#1d0733;border:1px solid var(--edge);border-bottom-width:2px;border-radius:5px;padding:2px 7px;color:var(--ink);font:inherit}a{color:var(--cyan);text-decoration:none;border-bottom:1px solid #ffffff2e}a:hover{border-bottom-color:var(--cyan)}footer{color:var(--dim);font-size:12px;text-align:center}#boot{color:var(--dim);font-size:12px;letter-spacing:.1em}</style></head><body><h1>SKOKAN</h1><p class=sub>one button. don't touch the water.</p><div id=wrap><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=0></canvas></div><div id=boot>loading…</div><div class=keys><span><kbd>space</kbd> jump — hold for height</span> <span><kbd>space</kbd> again mid-air = double jump</span> <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> let a bot play</span> <span><kbd>0</kbd> take over</span></div><footer>Runs the same C++ as the <a href=https://github.com/letalvoj/skokan>ESP32 arcade box</a> it was built for — only the screen, clock and button are swapped.<br>by <a href=https://letalvoj.github.io>Vojtech Letal</a></footer><script>var canvas=document.getElementById("canvas"),boot=document.getElementById("boot");window.addEventListener("keydown",(function(n){["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(n.code)>=0&&n.preventDefault()}),{passive:!1}),canvas.addEventListener("click",(function(){canvas.focus()}));var Module={canvas:canvas,print:function(n){console.log(n)},printErr:function(n){console.error(n)},setStatus:function(n){boot&&(boot.textContent=n||"")},onRuntimeInitialized:function(){boot&&(boot.textContent="click the game, then press space"),canvas.focus()}}</script><script async src=index.js></script></body></html>
