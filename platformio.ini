; esp32-mluvitko — talking box
; Board: ESP32-S3-N16R8 (16MB flash, 8MB octal PSRAM)

[platformio]
default_envs = mluvitko

[env:mluvitko]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; We talk over the CH343 USB-serial bridge (UART0), not native USB,
; so Serial must NOT be redirected to USB CDC.
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=3

; N16R8 = quad SPI flash + octal (OPI) PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv

; Port deliberately NOT pinned: the board has two USB-C ports that enumerate
; under different names, and the name changes between sessions. Let
; PlatformIO auto-detect, or pass --upload-port /dev/cu.usbmodemXXX.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit ST7735 and ST7789 Library
	adafruit/Adafruit ILI9341
	kosme/arduinoFFT@^2.0.4

; Default build = the current full app (face + button + speaker + gated mic).
build_src_filter = +<step3_full.cpp> +<display.cpp> +<synth.cpp> +<mic.cpp>

; Bring-up step 1: button + speaker only. Nothing else is compiled in.
;   pio run -e step1 -t upload
[env:step1]
extends = env:mluvitko
build_src_filter = +<step1_button_speaker.cpp>

; Bring-up step 2: display + button + speaker. Still no microphone.
;   pio run -e step2 -t upload
[env:step2]
extends = env:mluvitko
build_src_filter = +<step2_display_button_speaker.cpp> +<display.cpp> +<synth.cpp>

; Bring-up step 3: everything, with the mic gated behind the button LED.
;   pio run -e step3 -t upload
[env:step3]
extends = env:mluvitko
build_src_filter = +<step3_full.cpp> +<display.cpp> +<synth.cpp> +<mic.cpp>

; SKOKAN -- the one-button platform game. No microphone; the display runs in
; landscape and the arcade button is the only control.
;   pio run -e game -t upload
[env:game]
extends = env:mluvitko
build_src_filter = +<game.cpp> +<display.cpp> +<synth.cpp>

; Same game, but Serial comes out of the board's OTHER USB-C -- the ESP32-S3's
; native USB (303a:1001), not the CH343 bridge. Use this when the cable is in
; the native port and you want the console (fps, the f/r keys); the plain
; `game` env keeps the console on the CH343 port like every other build.
;   pio run -e game_usb -t upload
[env:game_usb]
extends = env:game
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=3
